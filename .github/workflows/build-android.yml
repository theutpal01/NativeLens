name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger via Actions tab

permissions:
  contents: read

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_SECRET }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Important for large assets
      
      # 2. Cache Unity Library folder (speeds up subsequent builds)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: |
            Library
            Assets/AddressableAssetsData
          key: unity-library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Validate Unity license secret
        shell: bash
        run: |
          if [ -z "${UNITY_LICENSE}" ]; then
            echo "::error::Unity license is missing. Set repository secret UNITY_LICENSE or UNITY_SECRET with full Unity_lic.ulf content."
            exit 1
          fi
          if [ "${#UNITY_LICENSE}" -lt 100 ]; then
            echo "::error::Unity license secret appears incomplete. Paste the full Unity_lic.ulf content, not just the XML header."
            exit 1
          fi
      
      # 3. Activate Unity License (Personal/Free)
      - name: Activate Unity License
        uses: game-ci/unity-activate@v2
        # For Personal license, you can also use:
        # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE_PERSONAL }}
      
      # 4. Build Android APK
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildMethod: NativeLens.Utils.SceneBootstrap/BuildAPK
          customParameters: -quit -batchmode -nographics
      
      # 5. Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NativeLens-APK
          path: build/NativeLens.apk
          retention-days: 30
      
      # 6. Create Release (on tag push)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/NativeLens.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Run tests
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-test-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Validate Unity license secret
        shell: bash
        run: |
          if [ -z "${UNITY_LICENSE}" ]; then
            echo "::error::Unity license is missing. Set repository secret UNITY_LICENSE or UNITY_SECRET with full Unity_lic.ulf content."
            exit 1
          fi
          if [ "${#UNITY_LICENSE}" -lt 100 ]; then
            echo "::error::Unity license secret appears incomplete. Paste the full Unity_lic.ulf content, not just the XML header."
            exit 1
          fi
      
      - name: Activate Unity License
        uses: game-ci/unity-activate@v2
      
      - name: Run Tests
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: playmode
          artifactsPath: test-results
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: test-results