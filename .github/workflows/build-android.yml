name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      # 2. Cache Unity Library folder
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: |
            Library
            Assets/AddressableAssetsData
          key: unity-library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-${{ runner.os }}-
      
      # 3. Build Android APK (includes license activation inside Docker)
      - name: Build Android APK
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2022.3.22f1
          targetPlatform: Android
          buildMethod: NativeLens.Utils.SceneBootstrap/BuildAPK
          customParameters: -quit -batchmode -nographics
          cacheKey: unity-${{ runner.os }}-2022.3.22f1
          androidTargetSdkVersion: 33
      
      # 4. Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NativeLens-APK
          path: build/Android/Android.apk
          retention-days: 30
      
      # 5. Create Release (on tag push)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/Android/Android.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Run tests
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-test-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
      
      - name: Run Tests
        uses: game-ci/unity-test-runner@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2022.3.22f1
          testMode: playmode
          artifactsPath: test-results
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: test-results